plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace "com.vscorp.rnhost"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    // React Native Core Dependencies (from Maven Central)
    // Using 'api' instead of 'implementation' so these classes are exposed to consuming apps
    // This allows the native app to compile against React Native classes
    api "com.facebook.react:react-android:0.81.5"
    api "com.facebook.react:hermes-android:0.81.5"
    
    // React Native Transitive Dependencies
    // Using 'api' for classes that consuming apps need to reference
    // JNI and Native Library Loading
    api 'com.facebook.fbjni:fbjni:0.7.0'
    api 'com.facebook.soloader:soloader:0.12.1'
    
    // Type Annotations
    api 'com.facebook.infer.annotation:infer-annotation:0.18.0'
    
    // Image Loading (Fresco)
    api 'com.facebook.fresco:fresco:3.1.3'
    api 'com.facebook.fresco:imagepipeline-okhttp3:3.1.3'
    
    // Networking (OkHttp)
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'com.squareup.okio:okio:3.6.0'
    
    // AndroidX Fragment (for RNFragment)
    api 'androidx.fragment:fragment-ktx:1.6.2'
}


// Publishing configuration (added by publish-aar.sh)
afterEvaluate { project ->
    def publishVersion = project.findProperty("publish_version") ?: "1.0.0"
    
    project.publishing {
        publications {
            release(MavenPublication) {
                groupId = "com.vscorp"
                artifactId = "vsco-rn-host-sdk"
                version = publishVersion
                from components.release
            }
        }
        
        repositories {
            mavenLocal()
        }
    }
    
    project.tasks.named("publishReleasePublicationToMavenLocal").configure {
        dependsOn("assembleRelease")
    }
}
